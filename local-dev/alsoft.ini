# OpenAL Soft settings for the local x64 runtime. Source: keeperfx/local-dev/alsoft.ini,
# installed beside the executables by prepare-x64-runtime.ps1. Edit the source copy.
# The bundled OpenAL Soft 1.25.1 only has the DirectSound backend. Its default
# 512 x 3 frame buffer (32 ms) is too short for DirectSound on modern Windows,
# which then replays stale buffer contents: crackle/tearing in busy scenes.
# 1024 x 4 frames = 85 ms buffer, so each mix lands about 64 ms ahead of playback.
[general]
period_size=1024
periods=4
